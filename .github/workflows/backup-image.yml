# Constrói a imagem do serviço de backup (backup/Dockerfile) e publica em ghcr.io.
# A imagem contém só os scripts; nenhuma credencial ou dado entra nela.
name: backup-image
on:
  push:
    branches: [main]
    paths: ["backup/**", ".github/workflows/backup-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backup
          push: true
          tags: |
            ghcr.io/sallescarneiro/a360-backup:latest
            ghcr.io/sallescarneiro/a360-backup:${{ github.sha }}
